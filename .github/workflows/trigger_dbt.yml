name: Trigger dbt Cloud on merge to main

on:
  push:
    branches: [ main ]

jobs:
  trigger-dbt:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dbt Cloud Job
        run: |
          curl -X POST \
            -H "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"cause": "Triggered by merge to main"}' \
            https://qi096.us1.dbt.com/api/v2/accounts/70506183162681/jobs/70506183139687/run/